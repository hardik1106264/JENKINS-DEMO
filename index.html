<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin: 30px 0;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        @media (max-width: 700px) {
            .form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="form">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="rollNo"
                placeholder="Roll Number"
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
            >

            <button onclick="addStudent()">
                Add Student
            </button>

        </div>

        <h2>Student List</h2>

        <table>

            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

    <script>

        function addStudent() {

            const name =
                document.getElementById("name").value.trim();

            const rollNo =
                document.getElementById("rollNo").value.trim();

            const course =
                document.getElementById("course").value.trim();

            if (name === "" || rollNo === "" || course === "") {

                alert("Please fill all fields");

                return;
            }

            const table =
                document.getElementById("studentTable");

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${rollNo}</td>
                <td>${name}</td>
                <td>${course}</td>
                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteStudent(this)">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);

            document.getElementById("name").value = "";
            document.getElementById("rollNo").value = "";
            document.getElementById("course").value = "";
        }

        function deleteStudent(button) {

            button.parentElement.parentElement.remove();

        }

    </script>

</body>

</html>
